apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-swarm
  labels:
    {{- include "metapen.labels" . | nindent 4 }}
spec:
  parallelism: {{ .Values.swarm.parallelism }}
  completions: {{ .Values.swarm.completions }}
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metapen
        app.kubernetes.io/component: agent
        metapen.io/scope: {{ .Values.scope }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName }}
      restartPolicy: Never
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: exec-logs
          emptyDir: {}
        - name: scope
          secret:
            secretName: {{ .Release.Name }}-scope
        - name: agent-prompts
          configMap:
            name: {{ .Release.Name }}-agent-prompts
      containers:
        - name: tool-executor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: METAPEN_SCOPE_FILE
              value: /etc/metapen/scope.yaml
            - name: METAPEN_CONCURRENCY_CAP
              value: {{ .Values.swarm.concurrencyCap | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: exec-logs, mountPath: /var/log/exec }
            - { name: scope, mountPath: /etc/metapen, readOnly: true }
            - { name: agent-prompts, mountPath: /etc/metapen/prompts, readOnly: true }
        {{- if or .Values.zkvm.enabled true }}
        - name: zk-proof-sidecar
          # PLANNED: SHA256 log hashing only. zkvm.enabled={{ .Values.zkvm.enabled }} mode={{ .Values.zkvm.mode }}
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[zk-sidecar] PLANNED mode={{ .Values.zkvm.mode }}; SHA256 only.";
              while true; do
                [ -f /var/log/exec/agent.log ] && sha256sum /var/log/exec/agent.log > /var/log/exec/receipt.sha256;
                sleep 10;
              done
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "200m", memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: exec-logs, mountPath: /var/log/exec }
        {{- end }}
